<!doctype html>
<html lang="zh-CN" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 | 子恒的博客</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>●</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    /* ============================================
       DESIGN TOKENS — 与主页一致
       ============================================ */
    :root {
      --bg-base: #05070A;
      --bg-elevated: #0B0F14;
      --bg-surface: #111827;
      --text-primary: #F5F7FA;
      --text-secondary: #D1D5DB;
      --text-muted: rgba(255, 255, 255, 0.35);
      --accent: #0071E3;
      --accent-light: #3B82F6;
      --accent-glow: rgba(0, 113, 227, 0.15);
      --accent-purple: #6366F1;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-bg-strong: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-border-hover: rgba(255, 255, 255, 0.14);
      --divider: rgba(255, 255, 255, 0.04);
      --btn-bg: rgba(255, 255, 255, 0.06);
      --btn-border: rgba(255, 255, 255, 0.12);
      --radius-sm: 0.75rem;
      --radius-md: 1.25rem;
      --radius-lg: 1.75rem;
      --radius-full: 9999px;
      --font-sans: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      --font-mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    }

    [data-theme="light"] {
      --bg-base: #F5F7FA;
      --bg-elevated: #FFFFFF;
      --bg-surface: #E5E7EB;
      --text-primary: #1D1D1F;
      --text-secondary: rgba(0, 0, 0, 0.6);
      --text-muted: rgba(0, 0, 0, 0.35);
      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-bg-strong: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(0, 0, 0, 0.06);
      --glass-border-hover: rgba(0, 0, 0, 0.12);
      --divider: rgba(0, 0, 0, 0.06);
      --btn-bg: rgba(0, 0, 0, 0.04);
      --btn-border: rgba(0, 0, 0, 0.1);
    }

    /* ============================================
       RESET & BASE
       ============================================ */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      overflow: hidden;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                  color 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
    }

    /* ============================================
       AMBIENT OVERLAYS
       ============================================ */
    .noise-overlay {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.45'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px 180px;
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="light"] .noise-overlay {
      opacity: 0.02;
    }

    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center, transparent 55%, var(--bg-base) 100%);
      opacity: 0.55;
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="light"] .vignette {
      opacity: 0.2;
    }

    /* ============================================
       LOGIN LAYOUT
       ============================================ */
    #login-page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
      position: relative;
      z-index: 10;
    }

    /* ============================================
       LEFT PANEL — 角色动画
       ============================================ */
    .left-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(135deg, #0a0e1a 0%, #0d1225 50%, #0a0f1e 100%);
      padding: 40px 48px;
      overflow: hidden;
    }

    [data-theme="light"] .left-panel {
      background: linear-gradient(135deg, #d4d0dc 0%, #c8c4d0 50%, #bbb7c5 100%);
    }

    .left-panel .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      z-index: 10;
      position: relative;
      letter-spacing: 0.08em;
    }

    .left-panel .logo svg {
      width: 28px;
      height: 28px;
      background: rgba(0, 113, 227, 0.15);
      backdrop-filter: blur(8px);
      padding: 4px;
      border-radius: 6px;
    }

    .characters-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 420px;
    }

    .left-panel .footer-links {
      display: flex;
      gap: 28px;
      font-size: 13px;
      color: var(--text-muted);
      z-index: 10;
      position: relative;
    }

    .left-panel .footer-links a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }

    .left-panel .footer-links a:hover {
      color: var(--text-secondary);
    }

    .left-panel::after {
      content: "";
      position: absolute;
      top: 20%;
      right: 15%;
      width: 260px;
      height: 260px;
      background: rgba(0, 113, 227, 0.12);
      border-radius: 50%;
      filter: blur(80px);
    }

    .left-panel::before {
      content: "";
      position: absolute;
      bottom: 15%;
      left: 10%;
      width: 350px;
      height: 350px;
      background: rgba(99, 102, 241, 0.08);
      border-radius: 50%;
      filter: blur(100px);
    }

    /* ============================================
       RIGHT PANEL — 表单
       ============================================ */
    .right-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-elevated);
      padding: 40px;
      position: relative;
      overflow: hidden;
      transition: background-color 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .right-panel::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 2px;
    }

    .form-container {
      width: 100%;
      max-width: 400px;
    }

    .sparkle-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .sparkle-icon svg {
      width: 32px;
      height: 32px;
    }

    .sparkle-icon svg path {
      fill: var(--text-primary);
      transition: fill 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .form-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .form-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      transition: color 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .form-header p {
      font-size: 14px;
      color: var(--text-secondary);
      transition: color 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ============================================
       FORM FIELDS
       ============================================ */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
      transition: color 0.3s;
    }

    .form-group .input-wrapper {
      position: relative;
    }

    .form-group input {
      width: 100%;
      height: 48px;
      border: none;
      border-bottom: 1.5px solid var(--glass-border);
      padding: 0 40px 0 0;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-primary);
      background: transparent;
      outline: none;
      transition: border-color 0.3s, color 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .form-group input:focus {
      border-bottom-color: var(--accent);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    .form-group input[type="password"]:not(:placeholder-shown) {
      font-family: inherit;
      letter-spacing: 2px;
    }

    .form-group input[type="password"]::-ms-reveal,
    .form-group input[type="password"]::-ms-clear {
      display: none;
    }

    .toggle-password {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 6px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--text-primary);
    }

    /* ============================================
       OPTIONS ROW
       ============================================ */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .forgot-link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .forgot-link:hover {
      opacity: 0.8;
    }

    /* ============================================
       BUTTONS
       ============================================ */
    .btn-login {
      position: relative;
      width: 100%;
      height: 50px;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      overflow: hidden;
      margin-bottom: 14px;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 113, 227, 0.35);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login .btn-text {
      display: inline-block;
      transition: all 0.3s;
    }

    .btn-login .btn-hover-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-purple));
      color: #fff;
      opacity: 0;
      transition: all 0.3s;
      border-radius: var(--radius-full);
    }

    .btn-login:hover .btn-text {
      transform: translateX(40px);
      opacity: 0;
    }

    .btn-login:hover .btn-hover-content {
      opacity: 1;
    }

    .btn-google {
      position: relative;
      width: 100%;
      height: 50px;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-google:hover {
      border-color: var(--glass-border-hover);
      background: var(--glass-bg-strong);
      transform: translateY(-2px);
    }

    .btn-google .btn-text {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s;
    }

    .btn-google .btn-hover-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-purple));
      color: #fff;
      opacity: 0;
      transition: all 0.3s;
      border-radius: var(--radius-full);
    }

    .btn-google:hover .btn-text {
      transform: translateX(40px);
      opacity: 0;
    }

    .btn-google:hover .btn-hover-content {
      opacity: 1;
    }

    .google-icon {
      width: 18px;
      height: 18px;
    }

    /* ============================================
       SIGNUP LINK
       ============================================ */
    .signup-link {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 32px;
      transition: color 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .signup-link a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    /* ============================================
       THEME TOGGLE
       ============================================ */
    .theme-toggle-wrap {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 300;
    }

    .theme-toggle {
      width: 52px;
      height: 28px;
      border-radius: var(--radius-full);
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      padding: 3px;
      display: flex;
      align-items: center;
      transition: all 0.3s;
    }

    .theme-toggle:hover {
      border-color: var(--glass-border-hover);
    }

    .theme-toggle-track {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .theme-toggle-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="light"] .theme-toggle-thumb {
      transform: translateX(24px);
    }

    .theme-toggle-thumb svg {
      width: 12px;
      height: 12px;
      color: #fff;
    }

    .theme-icon-sun {
      display: none;
    }

    .theme-icon-moon {
      display: block;
    }

    [data-theme="light"] .theme-icon-sun {
      display: block;
    }

    [data-theme="light"] .theme-icon-moon {
      display: none;
    }

    /* Back to home — 桌面端隐藏，仅移动端显示 */
    .back-home {
      display: none;
    }

    @media (max-width: 900px) {
      .back-home {
        position: fixed;
        top: 1.5rem;
        left: 1.5rem;
        z-index: 300;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.85rem;
        color: var(--text-muted);
        text-decoration: none;
        transition: color 0.3s;
      }

      .back-home:hover {
        color: var(--text-primary);
      }

      .back-home svg {
        width: 16px;
        height: 16px;
      }
    }

    /* ============================================
       ANIMATED CHARACTERS
       ============================================ */
    .characters-scene {
      position: relative;
      width: 480px;
      height: 360px;
    }

    .character {
      position: absolute;
      bottom: 0;
      transition: all 0.7s ease-in-out;
      transform-origin: bottom center;
    }

    .char-purple {
      left: 60px;
      width: 170px;
      height: 370px;
      background: linear-gradient(180deg, #6366F1 0%, #4F46E5 100%);
      border-radius: 10px 10px 0 0;
      z-index: 1;
    }

    .char-black {
      left: 220px;
      width: 115px;
      height: 290px;
      background: linear-gradient(180deg, #2d2d2d 0%, #1a1a1a 100%);
      border-radius: 8px 8px 0 0;
      z-index: 2;
    }

    [data-theme="light"] .char-black {
      background: linear-gradient(180deg, #4a4a4a 0%, #333 100%);
    }

    .char-orange {
      left: 0;
      width: 230px;
      height: 190px;
      background: linear-gradient(180deg, #ff9b6b 0%, #F97316 100%);
      border-radius: 115px 115px 0 0;
      z-index: 3;
    }

    .char-yellow {
      left: 290px;
      width: 135px;
      height: 215px;
      background: linear-gradient(180deg, #e8d754 0%, #EAB308 100%);
      border-radius: 68px 68px 0 0;
      z-index: 4;
    }

    .eyes {
      position: absolute;
      display: flex;
      transition: all 0.7s ease-in-out;
    }

    .eyeball {
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: height 0.15s ease;
      overflow: hidden;
    }

    .pupil {
      border-radius: 50%;
      background: #2d2d2d;
      transition: transform 0.1s ease-out;
    }

    .bare-pupil {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #2d2d2d;
      transition: transform 0.7s ease-in-out;
    }

    .yellow-mouth {
      position: absolute;
      width: 50px;
      height: 4px;
      background: #2d2d2d;
      border-radius: 2px;
      transition: all 0.7s ease-in-out;
    }

    /* Shake animation */
    @keyframes shakeHead {

      0%,
      100% {
        translate: 0 0;
      }

      10% {
        translate: -9px 0;
      }

      20% {
        translate: 7px 0;
      }

      30% {
        translate: -6px 0;
      }

      40% {
        translate: 5px 0;
      }

      50% {
        translate: -4px 0;
      }

      60% {
        translate: 3px 0;
      }

      70% {
        translate: -2px 0;
      }

      80% {
        translate: 1px 0;
      }

      90% {
        translate: -0.5px 0;
      }
    }

    .eyes.shake-head,
    .yellow-mouth.shake-head,
    .orange-mouth.shake-head {
      animation: shakeHead 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .orange-mouth {
      position: absolute;
      width: 28px;
      height: 14px;
      border: 3px solid #2d2d2d;
      border-top: none;
      border-radius: 0 0 14px 14px;
      opacity: 0;
      transition: all 0.7s ease-in-out;
    }

    .orange-mouth.visible {
      opacity: 1;
    }

    /* Error styles */
    .error-msg {
      display: none;
      padding: 10px 14px;
      font-size: 13px;
      color: #EF4444;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .form-group input.error {
      border-bottom-color: #EF4444;
    }

    .form-group label.error-label {
      color: #EF4444;
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 900px) {
      #login-page {
        grid-template-columns: 1fr;
      }

      .left-panel {
        display: none;
      }
    }
  </style>
</head>

<body>
  <!-- Ambient overlays -->
  <div class="noise-overlay" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Back to home -->
  <a href="index.html" class="back-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    返回首页
  </a>

  <!-- Theme toggle -->
  <div class="theme-toggle-wrap">
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换深色/浅色模式">
      <span class="theme-toggle-track">
        <span class="theme-toggle-thumb">
          <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
          <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21.64 13a1 1 0 00-1.05-.14 8.05 8.05 0 01-3.37.73 8.15 8.15 0 01-8.14-8.1 8.59 8.59 0 01.25-2A1 1 0 008.43 3a10.15 10.15 0 1010.62 10.62 1 1 0 00.59-.62z"/></svg>
        </span>
      </span>
    </button>
  </div>

  <!-- Login Page -->
  <div id="login-page">
    <!-- Left Panel — 角色动画 -->
    <div class="left-panel">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)">
          <path d="M12 2L15 9H9L12 2Z" />
          <path d="M12 22L9 15H15L12 22Z" />
          <path d="M2 12L9 9V15L2 12Z" />
          <path d="M22 12L15 15V9L22 12Z" />
        </svg>
        <span>子恒的博客</span>
      </div>
      <div class="characters-wrapper">
        <div class="characters-scene" id="characters-scene">

                  fill="#4285F4" />
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853" />
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11.96 11.96 0 001 12c0 1.94.46 3.77 1.18 5.07l3.66-2.84v-.14z"
                  fill="#FBBC05" />

                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335" />

              <span>使用 Google 登录</span>

                stroke-linecap="round" stroke-linejoin="round">

  <script>
    // ============================================
    // 主题切换
    // ============================================
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateCharacters();
    });

    // ============================================
    // 密码显示/隐藏
    // ============================================
    const passwordInput = document.getElementById("password");
    const emailInput = document.getElementById("email");
    const toggleBtn = document.getElementById("toggle-password");
    const eyeIcon = document.getElementById("eye-icon");
    const eyeOffIcon = document.getElementById("eye-off-icon");
    let showPassword = false;
    let isLoginError = false;

    toggleBtn.addEventListener("click", () => {
      showPassword = !showPassword;
      passwordInput.type = showPassword ? "text" : "password";
      eyeIcon.style.display = showPassword ? "none" : "block";
      eyeOffIcon.style.display = showPassword ? "block" : "none";
      updateCharacters();
    });

    // ============================================
    // 鼠标追踪 & 角色动画
    // ============================================
    let mouseX = 0,
      mouseY = 0;
    let isTyping = false;
    let isLookingAtEachOther = false;
    let isPurpleBlinking = false;
    let isBlackBlinking = false;
    let isPurplePeeking = false;
    let typingTimer = null;

    document.addEventListener("mousemove", (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!isTyping && !isLoginError) updateCharacters();
    });

    let isPasswordFocused = false;

    emailInput.addEventListener("focus", () => setTyping(true));
    emailInput.addEventListener("blur", () => setTyping(false));
    emailInput.addEventListener("input", () => updateCharacters());
    passwordInput.addEventListener("focus", () => {
      isPasswordFocused = true;
      updateCharacters();
    });
    passwordInput.addEventListener("blur", () => {
      isPasswordFocused = false;
      updateCharacters();
    });
    passwordInput.addEventListener("input", () => updateCharacters());

    function setTyping(typing) {
      isTyping = typing;
      if (typing) {
        isLookingAtEachOther = true;
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
          isLookingAtEachOther = false;
          updateCharacters();
        }, 800);
      } else {
        isLookingAtEachOther = false;
      }
      updateCharacters();
    }

    // 眨眼
    function scheduleBlinkPurple() {
      setTimeout(() => {
        isPurpleBlinking = true;
        updateCharacters();
        setTimeout(() => {
          isPurpleBlinking = false;
          updateCharacters();
          scheduleBlinkPurple();
        }, 150);
      }, Math.random() * 4000 + 3000);
    }

    function scheduleBlinkBlack() {
      setTimeout(() => {
        isBlackBlinking = true;
        updateCharacters();
        setTimeout(() => {
          isBlackBlinking = false;
          updateCharacters();
          scheduleBlinkBlack();
        }, 150);
      }, Math.random() * 4000 + 3000);
    }

    scheduleBlinkPurple();
    scheduleBlinkBlack();

    // 偷看密码
    function schedulePeek() {
      if (passwordInput.value.length > 0 && showPassword) {
        setTimeout(() => {
          if (passwordInput.value.length > 0 && showPassword) {
            isPurplePeeking = true;
            updateCharacters();
            setTimeout(() => {
              isPurplePeeking = false;
              updateCharacters();
              schedulePeek();
            }, 800);
          }
        }, Math.random() * 3000 + 2000);
      }
    }

    toggleBtn.addEventListener("click", () => {
      if (showPassword) schedulePeek();
    });

    function calcPosition(el) {
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 3;
      const dx = mouseX - cx;
      const dy = mouseY - cy;
      const faceX = Math.max(-15, Math.min(15, dx / 20));
      const faceY = Math.max(-10, Math.min(10, dy / 30));
      const bodySkew = Math.max(-6, Math.min(6, -dx / 120));
      return { faceX, faceY, bodySkew };
    }

    function calcPupilOffset(el, maxDist) {
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = mouseX - cx;
      const dy = mouseY - cy;
      const dist = Math.min(Math.sqrt(dx * dx + dy * dy), maxDist);
      const angle = Math.atan2(dy, dx);
      return { x: Math.cos(angle) * dist, y: Math.sin(angle) * dist };
    }

    function updateCharacters() {
      const purple = document.getElementById("char-purple");
      const black = document.getElementById("char-black");
      const orange = document.getElementById("char-orange");
      const yellow = document.getElementById("char-yellow");

      const purplePos = calcPosition(purple);
      const blackPos = calcPosition(black);
      const orangePos = calcPosition(orange);
      const yellowPos = calcPosition(yellow);

      const pwdLen = passwordInput.value.length;
      const isShowingPwd = pwdLen > 0 && showPassword;
      const isLookingAway = isPasswordFocused && !showPassword;

      // ---- 紫色角色 ----
      if (isShowingPwd) {
        purple.style.transform = "skewX(0deg)";
        purple.style.height = "370px";
      } else if (isLookingAway) {
        purple.style.transform = "skewX(-14deg) translateX(-20px)";
        purple.style.height = "410px";
      } else if (isTyping) {
        purple.style.transform = `skewX(${(purplePos.bodySkew || 0) - 12}deg) translateX(40px)`;
        purple.style.height = "410px";
      } else {
        purple.style.transform = `skewX(${purplePos.bodySkew}deg)`;
        purple.style.height = "370px";
      }

      const purpleEyes = document.getElementById("purple-eyes");
      const purpleEyeL = document.getElementById("purple-eye-l");
      const purpleEyeR = document.getElementById("purple-eye-r");
      const purplePupilL = document.getElementById("purple-pupil-l");
      const purplePupilR = document.getElementById("purple-pupil-r");

      purpleEyeL.style.height = isPurpleBlinking ? "2px" : "18px";
      purpleEyeR.style.height = isPurpleBlinking ? "2px" : "18px";

      if (isLoginError) {
        purpleEyes.style.left = "30px";
        purpleEyes.style.top = "55px";
        purplePupilL.style.transform = "translate(-3px, 4px)";
        purplePupilR.style.transform = "translate(-3px, 4px)";
      } else if (isLookingAway) {
        purpleEyes.style.left = "20px";
        purpleEyes.style.top = "25px";
        purplePupilL.style.transform = "translate(-5px, -5px)";
        purplePupilR.style.transform = "translate(-5px, -5px)";
      } else if (isShowingPwd) {
        purpleEyes.style.left = "20px";
        purpleEyes.style.top = "35px";
        const px = isPurplePeeking ? 4 : -4;
        const py = isPurplePeeking ? 5 : -4;
        purplePupilL.style.transform = `translate(${px}px, ${py}px)`;
        purplePupilR.style.transform = `translate(${px}px, ${py}px)`;
      } else if (isLookingAtEachOther) {
        purpleEyes.style.left = "55px";
        purpleEyes.style.top = "65px";
        purplePupilL.style.transform = "translate(3px, 4px)";
        purplePupilR.style.transform = "translate(3px, 4px)";
      } else {
        purpleEyes.style.left = 45 + purplePos.faceX + "px";
        purpleEyes.style.top = 40 + purplePos.faceY + "px";
        const po = calcPupilOffset(purpleEyeL, 5);
        purplePupilL.style.transform = `translate(${po.x}px, ${po.y}px)`;
        purplePupilR.style.transform = `translate(${po.x}px, ${po.y}px)`;
      }

      // ---- 黑色角色 ----
      if (isShowingPwd) {
        black.style.transform = "skewX(0deg)";
      } else if (isLookingAway) {
        black.style.transform = "skewX(12deg) translateX(-10px)";
      } else if (isLookingAtEachOther) {
        black.style.transform = `skewX(${(blackPos.bodySkew || 0) * 1.5 + 10}deg) translateX(20px)`;
      } else if (isTyping) {
        black.style.transform = `skewX(${(blackPos.bodySkew || 0) * 1.5}deg)`;
      } else {
        black.style.transform = `skewX(${blackPos.bodySkew}deg)`;
      }

      const blackEyes = document.getElementById("black-eyes");
      const blackEyeL = document.getElementById("black-eye-l");
      const blackEyeR = document.getElementById("black-eye-r");
      const blackPupilL = document.getElementById("black-pupil-l");
      const blackPupilR = document.getElementById("black-pupil-r");

      blackEyeL.style.height = isBlackBlinking ? "2px" : "16px";
      blackEyeR.style.height = isBlackBlinking ? "2px" : "16px";

      if (isLoginError) {
        blackEyes.style.left = "15px";
        blackEyes.style.top = "40px";
        blackPupilL.style.transform = "translate(-3px, 4px)";
        blackPupilR.style.transform = "translate(-3px, 4px)";
      } else if (isLookingAway) {
        blackEyes.style.left = "10px";
        blackEyes.style.top = "20px";
        blackPupilL.style.transform = "translate(-4px, -5px)";
        blackPupilR.style.transform = "translate(-4px, -5px)";
      } else if (isShowingPwd) {
        blackEyes.style.left = "10px";
        blackEyes.style.top = "28px";
        blackPupilL.style.transform = "translate(-4px, -4px)";
        blackPupilR.style.transform = "translate(-4px, -4px)";
      } else if (isLookingAtEachOther) {
        blackEyes.style.left = "32px";
        blackEyes.style.top = "12px";
        blackPupilL.style.transform = "translate(0px, -4px)";
        blackPupilR.style.transform = "translate(0px, -4px)";
      } else {
        blackEyes.style.left = 26 + blackPos.faceX + "px";
        blackEyes.style.top = 32 + blackPos.faceY + "px";
        const bo = calcPupilOffset(blackEyeL, 4);
        blackPupilL.style.transform = `translate(${bo.x}px, ${bo.y}px)`;
        blackPupilR.style.transform = `translate(${bo.x}px, ${bo.y}px)`;
      }

      // ---- 橙色角色 ----
      const orangeMouth = document.getElementById("orange-mouth");
      if (isLoginError) {
        orangeMouth.style.left = 80 + orangePos.faceX + "px";
        orangeMouth.style.top = "130px";
      }
      if (isShowingPwd) {
        orange.style.transform = "skewX(0deg)";
      } else {
        orange.style.transform = `skewX(${orangePos.bodySkew}deg)`;
      }

      const orangeEyes = document.getElementById("orange-eyes");
      const orangePupilL = document.getElementById("orange-pupil-l");
      const orangePupilR = document.getElementById("orange-pupil-r");

      if (isLoginError) {
        orangeEyes.style.left = "60px";
        orangeEyes.style.top = "95px";
        orangePupilL.style.transform = "translate(-3px, 4px)";
        orangePupilR.style.transform = "translate(-3px, 4px)";
      } else if (isLookingAway) {
        orangeEyes.style.left = "50px";
        orangeEyes.style.top = "75px";
        orangePupilL.style.transform = "translate(-5px, -5px)";
        orangePupilR.style.transform = "translate(-5px, -5px)";
      } else if (isShowingPwd) {
        orangeEyes.style.left = "50px";
        orangeEyes.style.top = "85px";
        orangePupilL.style.transform = "translate(-5px, -4px)";
        orangePupilR.style.transform = "translate(-5px, -4px)";
      } else {
        orangeEyes.style.left = 82 + orangePos.faceX + "px";
        orangeEyes.style.top = 90 + orangePos.faceY + "px";
        const oo = calcPupilOffset(orangePupilL, 5);
        orangePupilL.style.transform = `translate(${oo.x}px, ${oo.y}px)`;
        orangePupilR.style.transform = `translate(${oo.x}px, ${oo.y}px)`;
      }

      // ---- 黄色角色 ----
      if (isShowingPwd) {
        yellow.style.transform = "skewX(0deg)";
      } else {
        yellow.style.transform = `skewX(${yellowPos.bodySkew}deg)`;
      }

      const yellowEyes = document.getElementById("yellow-eyes");
      const yellowPupilL = document.getElementById("yellow-pupil-l");
      const yellowPupilR = document.getElementById("yellow-pupil-r");
      const yellowMouth = document.getElementById("yellow-mouth");

      if (isLoginError) {
        yellowEyes.style.left = "35px";
        yellowEyes.style.top = "45px";
        yellowPupilL.style.transform = "translate(-3px, 4px)";
        yellowPupilR.style.transform = "translate(-3px, 4px)";
        yellowMouth.style.left = "30px";
        yellowMouth.style.top = "92px";
        yellowMouth.style.transform = "rotate(-8deg)";
      } else if (isLookingAway) {
        yellowEyes.style.left = "20px";
        yellowEyes.style.top = "30px";
        yellowPupilL.style.transform = "translate(-5px, -5px)";
        yellowPupilR.style.transform = "translate(-5px, -5px)";
        yellowMouth.style.left = "15px";
        yellowMouth.style.top = "78px";
        yellowMouth.style.transform = "rotate(0deg)";
      } else if (isShowingPwd) {
        yellowEyes.style.left = "20px";
        yellowEyes.style.top = "35px";
        yellowPupilL.style.transform = "translate(-5px, -4px)";
        yellowPupilR.style.transform = "translate(-5px, -4px)";
        yellowMouth.style.left = "10px";
        yellowMouth.style.top = "88px";
        yellowMouth.style.transform = "rotate(0deg)";
      } else {
        yellowEyes.style.left = 52 + yellowPos.faceX + "px";
        yellowEyes.style.top = 40 + yellowPos.faceY + "px";
        const yo = calcPupilOffset(yellowPupilL, 5);
        yellowPupilL.style.transform = `translate(${yo.x}px, ${yo.y}px)`;
        yellowPupilR.style.transform = `translate(${yo.x}px, ${yo.y}px)`;
        yellowMouth.style.left = 40 + yellowPos.faceX + "px";
        yellowMouth.style.top = 88 + yellowPos.faceY + "px";
        yellowMouth.style.transform = "rotate(0deg)";
      }
    }

    // ============================================
    // 登录错误动画
    // ============================================
    let errorRecoverTimer = null;
    const shakeIds = [
      "purple-eyes", "black-eyes", "orange-eyes",
      "yellow-eyes", "yellow-mouth", "orange-mouth",
    ];

    function triggerLoginError() {
      if (errorRecoverTimer) {
        clearTimeout(errorRecoverTimer);
        errorRecoverTimer = null;
      }

      const shakeEls = shakeIds.map((id) => document.getElementById(id));
      shakeEls.forEach((el) => el.classList.remove("shake-head"));
      void document.body.offsetHeight;

      isLoginError = true;
      isPasswordFocused = false;
      updateCharacters();

      document.getElementById("orange-mouth").classList.add("visible");

      setTimeout(() => {
        shakeEls.forEach((el) => el.classList.add("shake-head"));
      }, 350);

      errorRecoverTimer = setTimeout(() => {
        isLoginError = false;
        errorRecoverTimer = null;
        document.getElementById("orange-mouth").classList.remove("visible");
        shakeEls.forEach((el) => el.classList.remove("shake-head"));
        updateCharacters();
      }, 2500);
    }

    // ============================================
    // 表单验证 & 提交
    // ============================================
    const API_BASE = 'http://localhost:3000/api';

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const pwd = passwordInput.value;
      const errEl = document.getElementById("error-msg");
      const emailLabel = document.getElementById("email-label");
      const pwdLabel = document.getElementById("password-label");

      // 重置错误状态
      errEl.style.display = "none";
      emailInput.classList.remove("error");
      passwordInput.classList.remove("error");
      emailLabel.classList.remove("error-label");
      pwdLabel.classList.remove("error-label");

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailInput.classList.add("error");
        emailLabel.classList.add("error-label");
        errEl.textContent = "请输入有效的邮箱地址。";
        errEl.style.display = "block";
        triggerLoginError();
        return;
      }

      if (!pwd || pwd.length < 6) {
        passwordInput.classList.add("error");
        pwdLabel.classList.add("error-label");
        errEl.textContent = "密码至少需要 6 个字符。";
        errEl.style.display = "block";
        triggerLoginError();
        return;
      }

      const btn = document.getElementById("btn-login");
      btn.querySelector(".btn-text").textContent = "登录中…";
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pwd })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          btn.querySelector(".btn-text").textContent = "登录成功！";
          setTimeout(() => window.location.href = 'index.html', 1000);
        } else {
          btn.querySelector(".btn-text").textContent = "登 录";
          btn.disabled = false;
          errEl.textContent = data.error || "邮箱或密码错误，请重试。";
          errEl.style.display = "block";
          passwordInput.classList.add("error");
          pwdLabel.classList.add("error-label");
          triggerLoginError();
        }
      } catch (err) {
        btn.querySelector(".btn-text").textContent = "登 录";
        btn.disabled = false;
        errEl.textContent = "无法连接服务器，请确认后端已启动。";
        errEl.style.display = "block";
        triggerLoginError();
      }
    });

    // Initial render
    updateCharacters();
  </script>
</body>

</html>
