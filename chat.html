<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="子恒的 AI 助手 — 智能对话，灵感无限。" />
  <title>AI 对话 | 子恒的博客</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="chat.css" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
</head>
<body>

  <!-- Noise overlay -->
  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- ============================================ -->
  <!-- SIDEBAR                                      -->
  <!-- ============================================ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="sidebar-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>ZIHENG AI</span>
      </a>
      <button class="new-chat-btn" id="newChatBtn" title="新对话">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="sidebar-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="搜索对话..." id="searchInput" />
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">今天</div>
      <div class="sidebar-history" id="chatHistory">
        <!-- Dynamic -->
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">昨天</div>
      <div class="sidebar-history">
        <a class="history-item" href="#">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>如何优化 React 性能</span>
        </a>
        <a class="history-item" href="#">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>TailwindCSS 最佳实践</span>
        </a>
      </div>
    </div>

    <div class="sidebar-footer">
      <a href="index.html" class="sidebar-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>返回主页</span>
      </a>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21.64 13a1 1 0 00-1.05-.14 8.05 8.05 0 01-3.37.73 8.15 8.15 0 01-8.14-8.1 8.59 8.59 0 01.25-2A1 1 0 008.43 3a10.15 10.15 0 1010.62 10.62 1 1 0 00.59-.62z"/></svg>
      </button>
    </div>
  </aside>

  <!-- Sidebar toggle (mobile) -->
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="切换侧栏">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- ============================================ -->
  <!-- MAIN CHAT AREA                               -->
  <!-- ============================================ -->
  <main class="chat-main" id="chatMain">

    <!-- Welcome screen -->
    <div class="welcome" id="welcomeScreen">
      <div class="welcome-glow"></div>
      <div class="welcome-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#0071E3"/>
              <stop offset="100%" style="stop-color:#6366F1"/>
            </linearGradient>
          </defs>
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="welcome-title">你好，我是 <span class="text-accent">ZIHENG AI</span></h1>
      <p class="welcome-sub">你的智能创作助手，随时为你解答问题、激发灵感。</p>

      <div class="welcome-suggestions">
        <button class="suggestion-card" data-prompt="帮我写一段创意自我介绍">
          <div class="suggestion-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <span>帮我写一段创意自我介绍</span>
        </button>
        <button class="suggestion-card" data-prompt="用代码实现一个粒子动画效果">
          <div class="suggestion-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </div>
          <span>用代码实现一个粒子动画效果</span>
        </button>
        <button class="suggestion-card" data-prompt="推荐几个提升设计审美的方法">
          <div class="suggestion-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <span>推荐几个提升设计审美的方法</span>
        </button>
        <button class="suggestion-card" data-prompt="解释一下 Three.js 的基本原理">
          <div class="suggestion-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          </div>
          <span>解释一下 Three.js 的基本原理</span>
        </button>
      </div>
    </div>

    <!-- Messages container -->
    <div class="messages" id="messages">
      <!-- Dynamic messages -->
    </div>

    <!-- Typing indicator -->
    <div class="typing-indicator" id="typingIndicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>

    <!-- ============================================ -->
    <!-- INPUT AREA                                   -->
    <!-- ============================================ -->
    <div class="input-area">
      <div class="input-wrapper" id="inputWrapper">
        <textarea
          id="chatInput"
          placeholder="输入你的问题..."
          rows="1"
          maxlength="4000"
        ></textarea>
        <div class="input-actions">
          <button class="input-action-btn" title="上传图片" id="attachBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
          <button class="send-btn" id="sendBtn" disabled title="发送">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
      <p class="input-hint">ZIHENG AI 可能会犯错，请核实重要信息。</p>
    </div>
  </main>

  <!-- Mobile sidebar overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script src="chat.js" defer></script>
</body>
</html>
